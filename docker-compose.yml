name: wordpress-practice

x-wordpress-env: &wordpress-env
  WORDPRESS_DB_HOST: mysql:3306
  WORDPRESS_DB_NAME: ${MYSQL_DATABASE:?}
  WORDPRESS_DB_USER: ${MYSQL_USER:?}
  WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:?}
  WORDPRESS_CONFIG_EXTRA: |
    define('WP_HOME', getenv('WP_PUBLIC_URL'));
    define('WP_SITEURL', getenv('WP_PUBLIC_URL'));
    define('WP_ENVIRONMENT_TYPE', 'local');

x-wordpress: &wordpress
  image: wordpress:php8.3-apache
  restart: unless-stopped
  volumes:
    - wordpress_data:/var/www/html
  networks:
    - wordpress_network
  healthcheck:
    test: [CMD, php, -r, "exit(@fsockopen('127.0.0.1', 80) ? 0 : 1);"]
    interval: 5s
    timeout: 3s
    retries: 30
    start_period: 20s

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?}
      MYSQL_USER: ${MYSQL_USER:?}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - wordpress_network
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null 2>&1']
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s

  wordpress1:
    <<: *wordpress
    environment:
      <<: *wordpress-env
      WP_PUBLIC_URL: http://localhost:8081
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      mysql:
        condition: service_healthy

  wordpress2:
    <<: *wordpress
    environment:
      <<: *wordpress-env
      WP_PUBLIC_URL: http://localhost:8082
    ports:
      - "127.0.0.1:8082:80"
    depends_on:
      mysql:
        condition: service_healthy
      wordpress1:
        condition: service_healthy

  wpcli:
    image: wordpress:cli-php8.3
    profiles: [tools]
    user: "33:33"
    environment:
      <<: *wordpress-env
      WP_PUBLIC_URL: http://localhost:8081
      WP_ADMIN_USER: ${WP_ADMIN_USER:?}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD:?}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL:?}
    volumes:
      - wordpress_data:/var/www/html
      - ./scripts:/scripts:ro
    networks:
      - wordpress_network

volumes:
  mysql_data:
  wordpress_data:

networks:
  wordpress_network:
    driver: bridge

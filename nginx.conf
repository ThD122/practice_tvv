events {
    worker_connections 1024;
}

http {
    log_format upstream_log '$remote_addr "$request" $status upstream=$upstream_addr';
    access_log /dev/stdout upstream_log;
    error_log /dev/stderr warn;

    # Группа серверов для балансировки
    upstream wordpress_backend {
        server wordpress1:80;
        server wordpress2:80;
    }

    # Сервер, принимающий запросы пользователей
    server {
        listen 80;

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://wordpress_backend;
            proxy_connect_timeout 2s;
            proxy_read_timeout 30s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}


events {
    worker_connections 1024;
}

http {
    # Логирование запросов с указанием выбранного сервера
    log_format backend_log
        '$remote_addr "$request" '
        'status=$status upstream=$upstream_addr';

    access_log /var/log/nginx/access.log backend_log;

    # Балансировка Round Robin (алгоритм по умолчанию)
    upstream wordpress_backend {
        server wordpress1:80;
        server wordpress2:80;
    }

    # Приём запросов от пользователей
    server {
        listen 80;
        server_name localhost;
	location = /healthz {
        access_log off;	
        return 200 "ok\n";
	}
        location / {
            proxy_pass http://wordpress_backend;

            # Передача заголовков исходного запроса
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Повторная попытка при ошибках upstream
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }
    }
}
